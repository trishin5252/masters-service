{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сервис поиска мастеров{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
  <script defer src="{% static 'homepage/js/main.js' %}"></script>
</head>
<body>
  {% include 'includes/navigation.html' %}
  <main class="container page-content" id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>Сервис поиска мастеров</span>
      <span>Учебный проект · {% now 'Y' %}</span>
    </div>
  </footer>
</body>
</html>
